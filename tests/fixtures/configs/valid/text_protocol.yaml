# 文本 ReAct 协议配置（降级路径）
dataset:
  root_path: data/public/input

agent:
  model: gpt-4o-mini
  api_base: https://api.example.com/v1
  api_key: sk-text-protocol
  max_steps: 8
  temperature: 0.1
  tool_protocol: text
  allow_parallel_tool_calls: false
  max_tokens: 4096
  enable_thinking: false
  max_empty_tool_call_retries: 4

run:
  output_dir: artifacts/runs
  max_workers: 2
  task_timeout_seconds: 300
