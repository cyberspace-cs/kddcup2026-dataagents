# 全显式采样字段配置：覆盖 _resolve_sampling_defaults 的 "用户全显式" 路径，
# 确保所有新加字段从 YAML → AgentConfig 的解析无静默丢失。
dataset:
  root_path: /tmp/sampling-dataset

agent:
  api_key: sk-sampling
  enable_thinking: true
  temperature: 0.6
  top_p: 0.95
  top_k: 20
  min_p: 0.0
  presence_penalty: 0.0
  seed: 42

run:
  output_dir: /tmp/sampling-runs
