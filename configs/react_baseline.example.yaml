dataset:
  root_path: data/public/input

agent:
  model: YOUR_MODEL_NAME
  api_base: YOUR_API_BASE_URL
  api_key: YOUR_API_KEY
  max_steps: 16
  temperature: 0.0
  # 默认：OpenAI 原生 function calling。要求 vLLM 启用
  # --enable-auto-tool-choice --tool-call-parser qwen3_coder
  tool_protocol: native
  # 关到 false 可兼容个别 OpenAI 兼容后端（不支持 parallel_tool_calls 字段时）
  allow_parallel_tool_calls: true
  # 单次 chat.completions 输出上限（含 reasoning tokens）；0=不下发，走服务端默认。
  # 本地调百炼 Qwen3.5 限 TPM 的场景建议填，预扣 token 误差会小很多
  max_tokens: 16384
  # Qwen3 思考模式开关（经 OpenAI SDK extra_body 透传）；留空=服务端默认。
  # 线上 vLLM 启动时带 --reasoning-parser qwen3，默认 on；本地设 true 以对齐行为
  enable_thinking: true
  # 降级路径：端点不支持 tools= 时，改为文本 JSON fence ReAct
  # tool_protocol: text

run:
  output_dir: artifacts/runs
  run_id: example_run_id
  max_workers: 8
  task_timeout_seconds: 600
