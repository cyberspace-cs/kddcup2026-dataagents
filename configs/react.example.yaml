dataset:
  root_path: data/public/input             # 相对路径以 PROJECT_ROOT 为基锚定

agent:
  model: YOUR_MODEL_NAME                   # str (e.g. qwen3.5-35b-a3b)
  api_base: YOUR_API_BASE_URL              # str（OpenAI 兼容 chat.completions 端点）
  api_key: YOUR_API_KEY                    # str；若启用 api_keys 池则忽略此字段
  max_steps: 32                            # int >= 1; 28 gives enough budget for complex multi-step tasks
  allow_parallel_tool_calls: true          # bool；个别后端不支持 parallel_tool_calls 时设 false
  max_tokens: 16384                        # int >= 0；0=不下发上限走服务端默认
  enable_thinking: true                    # bool | null；null = 不下发 extra_body
  # backend_kind 决定思考模式参数在 extra_body 里的位置：
  # - "vllm":      enable_thinking 嵌套到 chat_template_kwargs
  # - "dashscope": enable_thinking 走顶层（DashScope OpenAI 兼容模式约定）
  # - "deepseek":  thinking 对象走顶层（DeepSeek V4 API 协议）
  # - null:        按 api_base 主机名自动推断（openai.resolve_backend_kind）
  # NEVER 硬编码 vllm：DashScope 演练时 chat_template_kwargs 会被静默忽略，
  # thinking 开关全部失效（ETL 关不掉思考，单调用慢 10×）。
  backend_kind: null                       # "vllm" | "dashscope" | "deepseek" | null

  # ---- 最优采样参数 (benchmarked: avg 0.80, best 0.82) ----
  # temp=0.6 在 Qwen3 thinking 模���下平衡了质量与稳定性：
  # - 低于 0.6 (如 0.3) 会触发 repetition，复杂任务 max_steps 耗尽
  # - 高于 0.6 (如 0.7) 增加 run-to-run variance，翻转题变多
  temperature: 0.6                         # float in [0, 2]
  top_p: 0.9                               # float in (0, 1] — narrower than 0.95, reduces variance
  top_k: 15                                # int >= 1 — narrower than 20, reduces variance
  min_p: 0.0                               # float in [0, 1]（经 extra_body 透传）
  presence_penalty: 0.0                    # float in [-2, 2] — Qwen3 thinking-mode default

  seed: 1024                               # int；与评测机 vLLM `--seed 1024` 对齐

  # ---- DeepSeek V4 思考模式（与 enable_thinking 互斥）----
  # thinking_mode: "enabled"               # "enabled" | "disabled" | null
  # reasoning_effort: "high"               # "high" | "max"；仅 thinking_mode="enabled" 时有效
  # 注意：DeepSeek thinking enabled 时 temperature/top_p 被服务端忽略。

  # ---- Pre-Act Planning (optional) ----
  # enable_preact: true adds a planning instruction on the first turn.
  # Benchmarked: slightly worse than false with current max_steps=28 (costs 1 extra turn).
  enable_preact: false

  # ---- 推荐：多 Key 池 + 跨进程限速 ----
  # 强烈建议启用——消除 429 限流导致的任务失败 (单次 run 可丢 4-6 题)。
  # api_keys 与 rate_limit 必须 "要么都写、要么都不写"；只写其一会被 load_app_config 拒绝。
  # 启用后 runner 按 task_index % len(api_keys) 给每个任务固定 Key，
  # 单 Key 独立走 RPM+TPM 双令牌桶（filelock 保护，跨进程安全）。
  api_keys:
    - YOUR_API_KEY_1
    - YOUR_API_KEY_2
  rate_limit:
    rpm_per_key: 600                       # int > 0
    tpm_per_key: 1000000                   # int > 0
    safety_factor: 0.85                    # float in (0, 1]
    reserve_output_tokens: 16384           # int > 0；不得超过 agent.max_tokens
    max_retries: 6                         # int >= 0
    backoff_initial_seconds: 1.0           # float > 0
    backoff_max_seconds: 30.0              # float >= backoff_initial_seconds

run:
  output_dir: artifacts/runs               # 相对路径以 PROJECT_ROOT 为基锚定
  run_id: null                             # str | null；null = 自动生成 `<UTC YYYYMMDD>-<NNN>`
  max_workers: 4                           # int >= 1; 8 with dual-key keeps throughput high
  task_timeout_seconds: 1200                # int；<= 0 关闭单任务超时
  retrieval_index:
    enabled: true                          # bool；启用后 runner 在 ETL 后构建 SQLite FTS5 索引
    cache_dir: artifacts/indexes           # 相对路径以 PROJECT_ROOT 为基锚定
    max_chunk_chars: 3200                  # int >= 200；文本分块上限
    chunk_overlap_lines: 2                 # int >= 0；相邻 chunk 重叠行数
    max_results: 16                         # int >= 1；search_context / lookup_field 返回上限

  # 跳过名单：问题歧义 / gold 错误 / 数据缺失的题，提交时移除不影响评分。
  blocklist:
    # - task_5  # 问题歧义
    # - task_13 # gold 错误：raceId=903 的 number 列不含 5 超时
    # - task_15 # 问题歧义
    # - task_17 # "type of expenses" 双绑定 (event.type vs expense_description)
    # - task_18 # 公式冲突：knowledge.md vs gold SQL 语义不一致

tracing:
  enabled: false                         # bool；默认关闭，开启后写 SQLite spans 供 dashboard 调试
  db_path: artifacts/traces.db           # 相对路径以 PROJECT_ROOT 为基锚定
