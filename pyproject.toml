[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "data-agent-baseline"
version = "0.1.0"
description = "ReAct-style baseline for the DABench data-agent benchmark"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "datasets>=3.3.2",
    "duckdb>=1.5.0",
    "huggingface-hub>=0.29.3",
    "numpy>=2.2.6",
    "openai>=2.28.0",
    "openpyxl>=3.1.5",
    "pandas>=2.3.3",
    "polars>=1.39.0",
    "pyarrow>=23.0.1",
    "pydantic>=2.10.6",
    "pyyaml>=6.0.2",
    "rich>=13.9.4",
    "typer>=0.15.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.5",
    "ruff>=0.11.0",
]

[project.scripts]
dabench = "data_agent_baseline.cli:main"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]
extend-exclude = [
    ".venv",
    "artifacts",
    "data",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle 错误
    "W",    # pycodestyle 警告
    "F",    # pyflakes（未使用变量/导入等）
    "I",    # isort（import 排序）
    "B",    # flake8-bugbear（常见陷阱）
    "UP",   # pyupgrade（新语法糖）
    "SIM",  # flake8-simplify
    "C4",   # flake8-comprehensions
    "PIE",  # flake8-pie
    "RUF",  # ruff 专属规则
]
ignore = [
    "E501",    # 行长由 formatter 负责，lint 不重复管
    "B008",    # Typer/FastAPI 风格：函数默认值里调用 Option(...) 是合法模式
    "RUF001",  # 中文注释/字符串里的全角标点（，（）：）是合法用法，不视为歧义
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# __init__.py 里的重导出属于公共 API 布局，不视为未使用
"__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["data_agent_baseline"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true

[tool.pytest.ini_options]
testpaths = ["tests"]
